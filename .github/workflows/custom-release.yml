name: Custom core release
on:
  workflow_dispatch:
  push:
    branches: [custom-dev]
    paths: ['.github/custom-release/request.json']
permissions:
  contents: read
concurrency:
  group: custom-core-release
  cancel-in-progress: true
jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Release paused: rewritten upstream history needs version-base validation.'
          exit 1
